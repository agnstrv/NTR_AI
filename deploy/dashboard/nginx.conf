# NTR dashboard: static site behind login. Replace the host name and certificate paths.
server {
    listen 80;
    server_name dashboard.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dashboard.example.ru;

    ssl_certificate     /etc/ssl/certs/dashboard.example.ru.crt;
    ssl_certificate_key /etc/ssl/private/dashboard.example.ru.key;

    root  /var/www/ntr-dashboard;
    index index.html;
    charset utf-8;

    auth_basic           "NTR";
    auth_basic_user_file /etc/nginx/ntr-dashboard.htpasswd;

    # the page re-reads data.json every 5 minutes: never serve a cached copy
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag  "noindex, nofollow" always;

    location ~ /\.git { deny all; }
    location / { try_files $uri $uri/ =404; }
}
