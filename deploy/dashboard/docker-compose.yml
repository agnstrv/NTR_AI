# NTR dashboard in two containers: `sync` pulls branch gh-pages every 5 minutes,
# `web` serves it behind a login. Create ./htpasswd first (see README.md).
services:
  sync:
    image: alpine/git:latest
    restart: unless-stopped
    environment:
      NTR_REPO: https://github.com/agnstrv/NTR_AI.git
      NTR_ROOT: /site
    volumes:
      - site:/site
      - ./update.sh:/update.sh:ro
    entrypoint: ["/bin/sh", "-c", "git config --global --add safe.directory /site; while true; do sh /update.sh || echo 'update failed'; sleep 300; done"]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [sync]
    ports:
      - "8080:80"
    volumes:
      - site:/usr/share/nginx/html:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  site:
