[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntr-building-ucx"
version = "0.1.0"
description = "Experimental convex building collision geometry and production notes"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "shapely>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]
